<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 618" width="824" height="618"
     role="img" aria-labelledby="noTitle noDesc"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="noTitle">Data flow of the Norce provider</title>
  <desc id="noDesc">Get Url calls the Norce API on a timer and saves the file URL and its state to table storage. Read File picks up the pending URL, downloads the file from Norce file storage, stages it in blob storage and adds a message to the queue. The message triggers a function that reads the staged file, parses it and onboards the data to Occtoo.</desc>

  <defs>
    <marker id="noArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#7C8899"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0.75" y="0.75" width="822.5" height="616.5" rx="14" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- deployable boundary -->
  <rect x="290" y="22" width="512" height="572" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="306" y="46" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#94A3B8">AZURE FUNCTION APP</text>

  <!-- ===== row 1: Norce API -> Get Url -> Table storage ===== -->
  <rect x="22" y="56" width="190" height="104" rx="12" fill="#E8F8F1" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(38,95)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9,5 L3.5,13 L9,21"/><path d="M17,5 L22.5,13 L17,21"/><path d="M14.5,4 L11.5,22"/>
  </g>
  <text x="74" y="102" font-size="16" font-weight="600" fill="#1F2937">Norce</text>
  <text x="74" y="124" font-size="12" fill="#64748B">Norce API</text>

  <rect x="308" y="56" width="190" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(324,95)"><path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/></g>
  <text x="360" y="102" font-size="16" font-weight="600" fill="#1F2937">Get Url</text>
  <text x="360" y="124" font-size="12" fill="#64748B">Timer trigger</text>

  <rect x="594" y="56" width="190" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(610,95)" fill="none" stroke="#64748B" stroke-width="1.7" stroke-linejoin="round">
    <rect x="3" y="4" width="20" height="18" rx="1.5"/>
    <path d="M3,10 h20 M3,16 h20 M9.6,4 v18 M16.3,4 v18"/>
  </g>
  <text x="646" y="102" font-size="16" font-weight="600" fill="#1F2937">Table storage</text>
  <text x="646" y="124" font-size="12" fill="#64748B">Import state</text>

  <!-- ===== row 2: Norce file storage -> Read File -> Blob storage ===== -->
  <rect x="22" y="248" width="190" height="104" rx="12" fill="#E8F8F1" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(38,287)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5,2 h9 l5.5,5.5 V24 H5 z"/><path d="M14,2 v5.5 h5.5"/>
  </g>
  <text x="74" y="284" font-size="16" font-weight="600" fill="#1F2937">Norce file</text>
  <text x="74" y="302" font-size="16" font-weight="600" fill="#1F2937">storage</text>
  <text x="74" y="324" font-size="12" fill="#64748B">Source files</text>

  <rect x="308" y="248" width="190" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(324,287)"><path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/></g>
  <text x="360" y="294" font-size="16" font-weight="600" fill="#1F2937">Read File</text>
  <text x="360" y="316" font-size="12" fill="#64748B">Timer trigger</text>

  <rect x="594" y="248" width="190" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(610,287)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5,2 h9 l5.5,5.5 V24 H5 z"/><path d="M14,2 v5.5 h5.5"/>
  </g>
  <text x="646" y="294" font-size="16" font-weight="600" fill="#1F2937">Blob storage</text>
  <text x="646" y="316" font-size="12" fill="#64748B">Staged file</text>

  <!-- ===== row 3: Occtoo <- Parse and onboard <- Message queue ===== -->
  <rect x="22" y="472" width="190" height="104" rx="12" fill="#FEF4EA" stroke="#E36103" stroke-width="1.5"/>
  <g transform="translate(38,511)" fill="none" stroke="#D9600B" stroke-width="1.8" stroke-linecap="round">
    <ellipse cx="13" cy="6" rx="9" ry="3.4"/>
    <path d="M4,6 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V6"/>
    <path d="M4,12.5 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V12.5"/>
  </g>
  <text x="74" y="518" font-size="16" font-weight="600" fill="#1F2937">Occtoo</text>
  <text x="74" y="540" font-size="12" fill="#64748B">Onboarding API</text>

  <rect x="308" y="472" width="190" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(324,511)"><path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/></g>
  <text x="360" y="508" font-size="16" font-weight="600" fill="#1F2937">Parse and</text>
  <text x="360" y="526" font-size="16" font-weight="600" fill="#1F2937">onboard</text>
  <text x="360" y="548" font-size="12" fill="#64748B">Queue trigger</text>

  <rect x="594" y="472" width="190" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(610,511)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round">
    <rect x="2.5" y="3" width="16" height="6" rx="1.6"/>
    <rect x="5" y="11" width="16" height="6" rx="1.6"/>
    <rect x="7.5" y="19" width="16" height="6" rx="1.6"/>
  </g>
  <text x="646" y="518" font-size="16" font-weight="600" fill="#1F2937">Message queue</text>
  <text x="646" y="540" font-size="12" fill="#64748B">Azure Queue Storage</text>

  <!-- ===== flow ===== -->
  <line x1="212" y1="108" x2="302" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="257" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">1. Get URL</text>

  <line x1="498" y1="108" x2="588" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="543" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">2. Save state</text>

  <polyline points="689,160 689,196 403,196 403,242" fill="none" stroke="#7C8899" stroke-width="2" marker-start="url(#noArrow)" marker-end="url(#noArrow)"/>
  <text x="546" y="188" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">3. Read and update state</text>

  <line x1="212" y1="300" x2="302" y2="300" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="257" y="288" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">4. Get file</text>

  <line x1="498" y1="300" x2="588" y2="300" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="543" y="288" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">5. Stage file</text>

  <polyline points="440,352 440,392 728,392 728,466" fill="none" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="584" y="384" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">6. Add message</text>

  <polyline points="650,352 650,432 366,432 366,466" fill="none" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="470" y="424" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">8. Read file</text>

  <line x1="594" y1="524" x2="504" y2="524" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="546" y="512" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">7. Triggers run</text>

  <line x1="308" y1="524" x2="218" y2="524" stroke="#7C8899" stroke-width="2" marker-end="url(#noArrow)"/>
  <text x="260" y="512" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">9. Onboard data</text>
</svg>
