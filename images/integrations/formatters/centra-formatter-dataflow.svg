<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 400" width="976" height="400"
     role="img" aria-labelledby="cfTitle cfDesc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="cfTitle">Data flow of the Centra formatter</title>
  <desc id="cfDesc">The Orchestrator runs on a timer every two minutes, gets data from the Occtoo destination API and fills a storage queue with product masters. Each queued message triggers ProcessProductMasterFromQueue, which imports products, variants and SKUs into the Centra API.</desc>

  <defs>
    <marker id="cfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#7C8899"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0.75" y="0.75" width="974.5" height="398.5" rx="14" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- deployable boundary -->
  <rect x="328" y="22" width="620" height="356" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="344" y="46" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#94A3B8">AZURE FUNCTION APP</text>

  <!-- ============ Occtoo (source) ============ -->
  <rect x="16" y="56" width="236" height="104" rx="12" fill="#FEF4EA" stroke="#E36103" stroke-width="1.5"/>
  <g transform="translate(32,95)" fill="none" stroke="#D9600B" stroke-width="1.8" stroke-linecap="round">
    <ellipse cx="13" cy="6" rx="9" ry="3.4"/>
    <path d="M4,6 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V6"/>
    <path d="M4,12.5 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V12.5"/>
  </g>
  <text x="68" y="102" font-size="16" font-weight="600" fill="#1F2937">Occtoo</text>
  <text x="68" y="124" font-size="12" fill="#64748B">Destination API</text>

  <!-- ============ Orchestrator ============ -->
  <rect x="352" y="56" width="236" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(368,95)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="404" y="102" font-size="16" font-weight="600" fill="#1F2937">Orchestrator</text>
  <text x="404" y="124" font-size="12" fill="#64748B">Timer trigger, every 2 min</text>

  <!-- ============ Storage queue ============ -->
  <rect x="688" y="56" width="236" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(704,95)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round">
    <rect x="2.5" y="3" width="16" height="6" rx="1.6"/>
    <rect x="5" y="11" width="16" height="6" rx="1.6"/>
    <rect x="7.5" y="19" width="16" height="6" rx="1.6"/>
  </g>
  <text x="740" y="102" font-size="16" font-weight="600" fill="#1F2937">Storage queue</text>
  <text x="740" y="124" font-size="12" fill="#64748B">Azure Queue Storage</text>

  <!-- ============ ProcessProductMasterFromQueue ============ -->
  <rect x="688" y="252" width="236" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(704,291)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="740" y="288" font-size="15" font-weight="600" fill="#1F2937">ProcessProductMaster</text>
  <text x="740" y="306" font-size="15" font-weight="600" fill="#1F2937">FromQueue</text>
  <text x="740" y="328" font-size="12" fill="#64748B">Queue trigger</text>

  <!-- ============ Centra (target) ============ -->
  <rect x="16" y="252" width="236" height="104" rx="12" fill="#E8F8F1" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(32,291)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9,5 L3.5,13 L9,21"/>
    <path d="M17,5 L22.5,13 L17,21"/>
    <path d="M14.5,4 L11.5,22"/>
  </g>
  <text x="68" y="298" font-size="16" font-weight="600" fill="#1F2937">Centra</text>
  <text x="68" y="320" font-size="12" fill="#64748B">Centra API</text>

  <!-- ============ flow ============ -->
  <!-- 1: Occtoo -> Orchestrator -->
  <line x1="252" y1="108" x2="346" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#cfArrow)"/>
  <text x="292" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">1. Get data</text>

  <!-- 2: Orchestrator -> queue -->
  <line x1="588" y1="108" x2="682" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#cfArrow)"/>
  <text x="635" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">2. Fill queue</text>

  <!-- 3: queue -> ProcessProductMasterFromQueue -->
  <line x1="806" y1="160" x2="806" y2="246" stroke="#7C8899" stroke-width="2" marker-end="url(#cfArrow)"/>
  <text x="821" y="196" font-size="12" font-weight="500" fill="#475569">3. Message</text>
  <text x="821" y="212" font-size="12" font-weight="500" fill="#475569">triggers run</text>

  <!-- 4: ProcessProductMasterFromQueue -> Centra -->
  <line x1="688" y1="304" x2="258" y2="304" stroke="#7C8899" stroke-width="2" marker-end="url(#cfArrow)"/>
  <text x="473" y="292" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">4. Import products, variants and SKUs</text>
</svg>
