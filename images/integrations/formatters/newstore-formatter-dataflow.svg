<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 420" width="904" height="420"
     role="img" aria-labelledby="nsTitle nsDesc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="nsTitle">Data flow of the NewStore formatter</title>
  <desc id="nsDesc">NewStoreExport is triggered over HTTP and gets data from the Occtoo destination API. It writes JSON files to blob storage and adds a message to a storage queue. The message triggers NewStoreOutboxDequeue, which sends the items to NewStore, and NewStore imports the JSON files from blob storage.</desc>

  <defs>
    <marker id="nsArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#7C8899"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0.75" y="0.75" width="902.5" height="418.5" rx="14" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- deployable boundary -->
  <rect x="316" y="22" width="564" height="342" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="332" y="46" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#94A3B8">AZURE FUNCTION APP</text>

  <!-- ============ Occtoo (source) ============ -->
  <rect x="16" y="56" width="216" height="104" rx="12" fill="#FEF4EA" stroke="#E36103" stroke-width="1.5"/>
  <g transform="translate(32,95)" fill="none" stroke="#D9600B" stroke-width="1.8" stroke-linecap="round">
    <ellipse cx="13" cy="6" rx="9" ry="3.4"/>
    <path d="M4,6 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V6"/>
    <path d="M4,12.5 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V12.5"/>
  </g>
  <text x="68" y="102" font-size="16" font-weight="600" fill="#1F2937">Occtoo</text>
  <text x="68" y="124" font-size="12" fill="#64748B">Destination API</text>

  <!-- ============ NewStoreExport ============ -->
  <rect x="332" y="56" width="216" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(348,95)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="384" y="102" font-size="16" font-weight="600" fill="#1F2937">NewStoreExport</text>
  <text x="384" y="124" font-size="12" fill="#64748B">HTTP trigger</text>

  <!-- ============ Storage queue ============ -->
  <rect x="648" y="56" width="216" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(664,95)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round">
    <rect x="2.5" y="3" width="16" height="6" rx="1.6"/>
    <rect x="5" y="11" width="16" height="6" rx="1.6"/>
    <rect x="7.5" y="19" width="16" height="6" rx="1.6"/>
  </g>
  <text x="700" y="102" font-size="16" font-weight="600" fill="#1F2937">Storage queue</text>
  <text x="700" y="124" font-size="12" fill="#64748B">Azure Queue Storage</text>

  <!-- ============ Blob storage ============ -->
  <rect x="332" y="236" width="216" height="104" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(348,275)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5,2 h9 l5.5,5.5 V24 H5 z"/>
    <path d="M14,2 v5.5 h5.5"/>
  </g>
  <text x="384" y="282" font-size="16" font-weight="600" fill="#1F2937">Blob storage</text>
  <text x="384" y="304" font-size="12" fill="#64748B">JSON files</text>

  <!-- ============ NewStoreOutboxDequeue ============ -->
  <rect x="648" y="236" width="216" height="104" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(664,275)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="700" y="272" font-size="16" font-weight="600" fill="#1F2937">NewStoreOutbox</text>
  <text x="700" y="290" font-size="16" font-weight="600" fill="#1F2937">Dequeue</text>
  <text x="700" y="312" font-size="12" fill="#64748B">Queue trigger</text>

  <!-- ============ NewStore (target) ============ -->
  <rect x="16" y="236" width="216" height="104" rx="12" fill="#E8F8F1" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(32,275)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9,5 L3.5,13 L9,21"/>
    <path d="M17,5 L22.5,13 L17,21"/>
    <path d="M14.5,4 L11.5,22"/>
  </g>
  <text x="68" y="282" font-size="16" font-weight="600" fill="#1F2937">NewStore</text>
  <text x="68" y="304" font-size="12" fill="#64748B">NewStore API</text>

  <!-- ============ flow ============ -->
  <!-- 1: Occtoo -> NewStoreExport -->
  <line x1="232" y1="108" x2="326" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="274" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">1. Get data</text>

  <!-- 2: NewStoreExport -> Blob storage -->
  <line x1="440" y1="160" x2="440" y2="230" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="455" y="190" font-size="12" font-weight="500" fill="#475569">2. Write</text>
  <text x="455" y="206" font-size="12" font-weight="500" fill="#475569">JSON files</text>

  <!-- 3: NewStoreExport -> Storage queue -->
  <line x1="548" y1="108" x2="642" y2="108" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="595" y="96" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">3. Add message</text>

  <!-- 4: Storage queue -> NewStoreOutboxDequeue -->
  <line x1="756" y1="160" x2="756" y2="230" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="771" y="190" font-size="12" font-weight="500" fill="#475569">4. Message</text>
  <text x="771" y="206" font-size="12" font-weight="500" fill="#475569">triggers run</text>

  <!-- 5: NewStoreOutboxDequeue -> NewStore (routed below) -->
  <polyline points="756,340 756,384 124,384 124,346" fill="none" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="440" y="402" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">5. Send items</text>

  <!-- 6: Blob storage -> NewStore -->
  <line x1="332" y1="288" x2="238" y2="288" stroke="#7C8899" stroke-width="2" marker-end="url(#nsArrow)"/>
  <text x="274" y="264" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">6. NewStore</text>
  <text x="274" y="280" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">imports files</text>
</svg>
