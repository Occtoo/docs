<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 388" width="860" height="388"
     role="img" aria-labelledby="bfTitle bfDesc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="bfTitle">Data flow of the Brink formatter</title>
  <desc id="bfDesc">AddToQueue is triggered over HTTP and gets data from the Occtoo destination API, then adds a message to an Azure storage queue. The message triggers BrinkFormatter, which puts the data to the Brink API.</desc>

  <defs>
    <marker id="bfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#7C8899"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0.75" y="0.75" width="858.5" height="386.5" rx="14" fill="#FBFBFD" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- deployable boundary -->
  <rect x="292" y="22" width="538" height="344" rx="14" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="308" y="46" font-size="11.5" font-weight="600" letter-spacing="1.3" fill="#94A3B8">AZURE FUNCTION APP</text>

  <!-- ============ Occtoo (source) ============ -->
  <rect x="16" y="56" width="190" height="92" rx="12" fill="#FEF4EA" stroke="#E36103" stroke-width="1.5"/>
  <g transform="translate(32,89)" fill="none" stroke="#D9600B" stroke-width="1.8" stroke-linecap="round">
    <ellipse cx="13" cy="6" rx="9" ry="3.4"/>
    <path d="M4,6 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V6"/>
    <path d="M4,12.5 v6.5 c0,1.9 4,3.4 9,3.4 s9,-1.5 9,-3.4 V12.5"/>
  </g>
  <text x="68" y="96" font-size="16" font-weight="600" fill="#1F2937">Occtoo</text>
  <text x="68" y="118" font-size="12" fill="#64748B">Destination API</text>

  <!-- ============ AddToQueue ============ -->
  <rect x="316" y="56" width="190" height="92" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(332,89)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="368" y="96" font-size="16" font-weight="600" fill="#1F2937">AddToQueue</text>
  <text x="368" y="118" font-size="12" fill="#64748B">HTTP trigger</text>

  <!-- ============ Storage queue ============ -->
  <rect x="616" y="56" width="190" height="92" rx="12" fill="#F2F5F8" stroke="#8A96A8" stroke-width="1.5"/>
  <g transform="translate(632,89)" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round">
    <rect x="2.5" y="3" width="16" height="6" rx="1.6"/>
    <rect x="5" y="11" width="16" height="6" rx="1.6"/>
    <rect x="7.5" y="19" width="16" height="6" rx="1.6"/>
  </g>
  <text x="668" y="96" font-size="16" font-weight="600" fill="#1F2937">Storage queue</text>
  <text x="668" y="118" font-size="12" fill="#64748B">Azure Queue Storage</text>

  <!-- ============ BrinkFormatter ============ -->
  <rect x="616" y="252" width="190" height="92" rx="12" fill="#EDF5FB" stroke="#3B82C4" stroke-width="1.5"/>
  <g transform="translate(632,285)">
    <path d="M15,1.5 L6,14.5 h5.5 l-2,9.5 9.5,-13.5 h-5.5 z" fill="#2A6FA8"/>
  </g>
  <text x="668" y="292" font-size="16" font-weight="600" fill="#1F2937">BrinkFormatter</text>
  <text x="668" y="314" font-size="12" fill="#64748B">Queue trigger</text>

  <!-- ============ Brink (target) ============ -->
  <rect x="16" y="252" width="190" height="92" rx="12" fill="#E8F8F1" stroke="#10B981" stroke-width="1.5"/>
  <g transform="translate(32,285)" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9,5 L3.5,13 L9,21"/>
    <path d="M17,5 L22.5,13 L17,21"/>
    <path d="M14.5,4 L11.5,22"/>
  </g>
  <text x="68" y="292" font-size="16" font-weight="600" fill="#1F2937">Brink Commerce</text>
  <text x="68" y="314" font-size="12" fill="#64748B">Brink API</text>

  <!-- ============ flow ============ -->
  <!-- 1: Occtoo -> AddToQueue -->
  <line x1="206" y1="102" x2="310" y2="102" stroke="#7C8899" stroke-width="2" marker-end="url(#bfArrow)"/>
  <text x="258" y="90" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">1. Get data</text>

  <!-- 2: AddToQueue -> queue -->
  <line x1="506" y1="102" x2="610" y2="102" stroke="#7C8899" stroke-width="2" marker-end="url(#bfArrow)"/>
  <text x="558" y="90" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">2. Add message</text>

  <!-- 3: queue -> BrinkFormatter -->
  <line x1="711" y1="148" x2="711" y2="246" stroke="#7C8899" stroke-width="2" marker-end="url(#bfArrow)"/>
  <text x="726" y="191" font-size="12" font-weight="500" fill="#475569">3. Message</text>
  <text x="726" y="207" font-size="12" font-weight="500" fill="#475569">triggers run</text>

  <!-- 4: BrinkFormatter -> Brink -->
  <line x1="616" y1="298" x2="212" y2="298" stroke="#7C8899" stroke-width="2" marker-end="url(#bfArrow)"/>
  <text x="414" y="286" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">4. Put data</text>
</svg>
